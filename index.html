<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>셀카 각도 측정기 📷</title>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      padding: 20px;
    }
    video {
      border: 2px solid #aaa;
      border-radius: 10px;
      max-width: 100%;
      height: auto;
      margin-top: 10px;
    }
    #angleDisplay {
      font-size: 1.8em;
      font-weight: bold;
      margin-top: 15px;
      color: #003366;
    }
    #captureBtn {
      margin: 20px auto;
      padding: 15px 30px;
      font-size: 1.2em;
      background-color: #007BFF;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.3s;
    }
    #captureBtn:hover {
      background-color: #0056b3;
    }
    #downloadLink {
      display: none;
      font-size: 1em;
      color: green;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <h1>셀카 각도 측정기 📷</h1>
  <p>핸드폰을 얼굴 정면에 두면 각도가 0°가 됩니다.<br>위로 들면 양수, 아래로 내리면 음수로 표시돼요.</p>
  <div id="angleDisplay">현재 각도: 0.00°</div>
  <video id="camera" autoplay playsinline></video>
  <br>
  <button id="captureBtn">📸 사진 촬영 + 각도 저장</button>
  <br>
  <a id="downloadLink">📥 사진 다운로드</a>

  <script>
    const video = document.getElementById('camera');
    navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: false })
      .then(stream => {
        video.srcObject = stream;
      });

    let currentPitch = 0.0;
    window.addEventListener('deviceorientation', function(event) {
      let pitchRaw = event.beta || 0.0;
      let pitch = pitchRaw - 90;
      if (pitch < -90) pitch = -90;
      if (pitch > 90) pitch = 90;
      currentPitch = pitch;
      document.getElementById('angleDisplay').innerText = `현재 각도: ${pitch.toFixed(2)}°`;
    });

    document.getElementById('captureBtn').addEventListener('click', () => {
      const canvas = document.createElement('canvas');
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0);
      ctx.fillStyle = 'red';
      ctx.font = '24px sans-serif';
      ctx.fillText(`Angle: ${currentPitch.toFixed(2)}°`, 20, 30);

      const imgData = canvas.toDataURL('image/png');
      const link = document.getElementById('downloadLink');
      link.href = imgData;
      link.download = `selfie_angle_${currentPitch.toFixed(2)}.png`;
      link.style.display = 'inline';
      link.click();
    });
  </script>
</body>
</html>
